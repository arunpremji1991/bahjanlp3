<header class="site-header" id="top">
  <div class="wrap header-inner">
    <a class="brand" href="{{brand_href}}" data-cta="header_logo">
      <img src="assets/img/bahjah-logo.jpg" width="40" height="36" alt="شعار جمعية بهجة العمانية للأيتام" data-alt-en="Omani Bahjah Orphan Society logo">
      <span class="brand-name" data-i18n="brand.full">جمعية بهجة العمانية للأيتام</span>
    </a>
    <nav class="header-nav" aria-label="أقسام الصفحة" data-i18n-aria="nav.aria">
{{nav}}
    </nav>
    <div class="header-actions">
      <button type="button" class="lang-btn" id="lang-btn" aria-label="Switch to English"><svg aria-hidden="true"><use href="#i-globe"/></svg><span class="lang-label" lang="en">EN</span></button>
      <a class="icon-btn" href="https://wa.me/96892877577" data-cta="header_whatsapp" aria-label="تواصل عبر واتساب" data-i18n-aria="wa.aria" rel="noopener"><svg aria-hidden="true"><use href="#i-whatsapp"/></svg></a>
      <a class="btn btn-primary btn-sm header-cta" href="{{cta_href}}" data-cta="header_cta"><span data-i18n="{{cta_key}}">{{cta_label}}</span></a>
    </div>
  </div>
</header>
